<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Trybewarts</title>
</head>
<body>
  <header class="header">
    <img src="images/trybewarts-header-logo.svg" alt="Trybewarts Header Logo" class="trybewarts-header-logo">
    <h1 id="trybewarts-header-title">Trybewarts</h1>
    <form action="" class="trybewarts-login">
      <label for="email">
        <input type="email" name="email" id="email" placeholder="Email">
      </label>
      <label for="password">
        <input type="password" name="password" id="password" placeholder="Senha">
      </label>
      <button type="submit" id="login-button">Entrar</button>
    </form>
  </header>

  <main>
    <form action="" id="evaluation-form">
      <label for="input-name">
        Nome: 
        <input type="text" name="name" id="input-name" placeholder="Nome">
      </label>
      <label for="input-lastname">
        Sobrenome: 
        <input type="text" name="lastname" id="input-lastname" placeholder="Sobrenome">
      </label>
      <label for="input-email">
        Email: 
        <input type="email" name="email" id="input-email" placeholder="Email">
      </label>
        <select name="select-house" id="house">
          <option value="Gitnória" id="gitnoria-house">Gitnória</option>
          <option value="Reactpuff" id="reactpuff-house">Reactpuff</option>
          <option value="Corvinode" id="corvinode-house">Corvinode</option>
          <option value="Pytherina" id="pytherina-house">Pytherina</option>
        </select>
    </form>
    <img src="images/trybewarts-colored.svg" alt="Trybewarts Colored Logo" id="trybewarts-forms-logo">
  </main>
</body>
<script src="script.js"></script>
</html>
