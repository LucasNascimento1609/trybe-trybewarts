<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Projeto Trybewarts</title>
  </head>
  <body>
    <header class="header">
      <img
        src="/images/trybewarts-header-logo.svg"
        alt="Marca da Trybe"
        class="trybewarts-header-logo"
      />
      <h1 id="trybewarts-header-title">Trybewarts</h1>
      <form action="" method="get" class="trybewarts-login">
        <label for="loginEmail">
          <input
            type="email"
            name="email"
            id="loginEmail"
            placeholder="Email"
          />
        </label>
        <label for="loginPass">
          <input
            type="password"
            name="password"
            id="loginPass"
            placeholder="Senha"
          />
        </label>
        <button type="submit" class="getBtn">Entrar</button>
      </form>
    </header>

    <main>
      <section>
        <div>
          <form action="" method="get" id="evaluation-form">
            <div>
              <div id="name-lastname">
                <label for="input-name">
                  <input type="text" id="input-name" placeholder="Nome" />
                </label>
                <label for="input-lastname">
                  <input
                    type="text"
                    id="input-lastname"
                    placeholder="Sobrenome"
                  />
                </label>
              </div>

              <div id="email-house">
                <label for="input-email">
                  <input
                    type="email"
                    name="email"
                    id="input-email"
                    placeholder="Email"
                  />
                </label>
                Casa:
                <select name="selectHouse" id="house">
                  <option value="Gitnória" id="gitnoria-house">Gitnória</option>
                  <option value="Reactpuff" id="reactpuff-house">Reactpuff</option>
                  <option value="Corvinode" id="corvinode-house">Corvinode</option>
                  <option value="Pytherina" id="pytherina-house">Pytherina</option>
                </select>
              </div>
            </div>
            <div>
              <div id="chose-family">
                <label for="" id="label-family">Qual sua família?</label>
                <label for=""><input type="radio" name="family" value="Frontend">Frontend</label>
                <label for=""><input type="radio" name="family" value="Backend">Backend</label>
                <label for=""><input type="radio" name="family" value="FullStack">FullStack</label>
              </div>
              <div>
                <label for="" id="label-content">Qual conteúdo você está com mais vontade de aprender?</label>
                <div>
                  <input type="checkbox" name="" id="" value="HoFs">Hofs
                  <input type="checkbox" name="" id="" value="Jest">Jest
                  <input type="checkbox" name="" id="" value="Promises">Promises
                  <input type="checkbox" name="" id="" value="React">React
                  <input type="checkbox" name="" id="" value="SQL">SQL
                  <input type="checkbox" name="" id="" value="Python">Python
                </div>
              </div>

            </div>
            <div>
              <div>
                <div>
                  <label id="label-rate"> Como você avalia a Trybewarts? </label>
                  <input type="radio" name="rate" id="" value="1" />1
                  <input type="radio" name="rate" id="" value="2" />2
                  <input type="radio" name="rate" id="" value="3" />3
                  <input type="radio" name="rate" id="" value="4" />4
                  <input type="radio" name="rate" id="" value="5" />5
                  <input type="radio" name="rate" id="" value="6" />6
                  <input type="radio" name="rate" id="" value="7" />7
                  <input type="radio" name="rate" id="" value="8" />8
                  <input type="radio" name="rate" id="" value="9" />9
                  <input type="radio" name="rate" id="" checked value="10" />10
                </div>
      
                <div>
                  <label for="" class="textarea"
                    ><p>Deixe seu comentário:</p></label
                  >
                  <textarea
                    name=""
                    id="textarea"
                    cols="40"
                    rows="5"
                    maxlength="500"
                  ></textarea>
                </div>
      
                <div>
                  <label for="agreement" id="label-infos"
                    >Você concorda com o uso das informações acima?
                    <input type="checkbox" name="" id="agreement" />
                  </label>
                </div>
      
                <div>
                  <button type="submit" id="submit-btn" disabled>Enviar</button>
                </div>
              </div>

            </div>
          </form>
        </div>

      </section>

      <section>
        <img
          src="./images/trybewarts-colored.svg"
          alt="Logo Trybewarts"
          id="trybewarts-forms-logo"
        />
      </section>
    </main>

    <footer>Direitos reservados à Trybewarts©</footer>

    <script src="script.js"></script>
  </body>
</html>
