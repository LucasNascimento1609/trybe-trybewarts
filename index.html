<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Trybewarts</title>
</head>
<body>
  <header class="header">
    <img src="images/trybewarts-header-logo.svg" alt="Trybewarts Header Logo" class="trybewarts-header-logo">
    <h1 id="trybewarts-header-title">Trybewarts</h1>
    <form action="" class="trybewarts-login">
      <label for="email">
        <input type="email" name="email" id="email" placeholder="Email">
      </label>
      <label for="password">
        <input type="password" name="password" id="password" placeholder="Senha">
      </label>
      <button type="submit" id="login-button">Entrar</button>
    </form>
  </header>

  <main>
    <form id="evaluation-form">
      <section id="name-lastname-section">
        <label for="input-name">
          Nome: 
          <input type="text" name="name" id="input-name" placeholder="Nome">
        </label>
        <label for="input-lastname">
          Sobrenome: 
          <input type="text" name="lastname" id="input-lastname" placeholder="Sobrenome">
        </label>
      </section>

      <section id="email-house-section">
        <label for="input-email">
          Email: 
          <input type="email" name="email" id="input-email" placeholder="Email">
        </label>
          <select name="select-house" id="house">
            <option value="Gitnória" id="gitnoria-house">Gitnória</option>
            <option value="Reactpuff" id="reactpuff-house">Reactpuff</option>
            <option value="Corvinode" id="corvinode-house">Corvinode</option>
            <option value="Pytherina" id="pytherina-house">Pytherina</option>
          </select>
      </section>

      <label id="label-family">Qual sua família?</label>
      <div class="family-options">
        <label>
          Frontend
          <input type="radio" name="family" value="Frontend">
        </label>
        <label>
          Backend
          <input type="radio" name="family" value="Backend">
        </label>
        <label>
          FullStack
          <input type="radio" name="family" value="FullStack">
        </label>
      </div>

      <label id="label-content">Qual conteúdo você está com mais vontade de aprender?</label>
      <div>
        <label>
          HoFs
          <input type="checkbox" name="content" value="HoFs" class="subject">
        </label>
        <label>
          Jest
          <input type="checkbox" name="content" value="Jest" class="subject">
        </label>
        <label>
          Promises
          <input type="checkbox" name="content" value="Promises" class="subject">
        </label>
        <label>
          React 
          <input type="checkbox" name="content" value="React" class="subject">
        </label>
        <label>
          SQL
          <input type="checkbox" name="content" value="SQL" class="subject">
        </label>
        <label>
          Python
          <input type="checkbox" name="content" value="Python" class="subject">
        </label>
      </div>

      <section class="rate-section">
        <label id="label-rate">Como você avalia a Trybewarts?</label>
        <div class="rate-options">
          <label>
            1
            <input type="radio" name="rate" value="1">
          </label>
          <label>
            2
            <input type="radio" name="rate" value="2">
          </label>
          <label>
            3
            <input type="radio" name="rate" value="3">
          </label>
          <label>
            4
            <input type="radio" name="rate" value="4">
          </label>
          <label>
            5
            <input type="radio" name="rate" value="5">
          </label>
          <label>
            6
            <input type="radio" name="rate" value="6">
          </label>
          <label>
            7
            <input type="radio" name="rate" value="7">
          </label>
          <label>
            8
            <input type="radio" name="rate" value="8">
          </label>
          <label>
            9
            <input type="radio" name="rate" value="9">
          </label>
          <label>
            10
            <input type="radio" name="rate" value="10">
          </label>
        </div>
      </section>
      
      <section>
        <label class="textarea"> Deixe seu comentário: </label>
        <textarea id="textarea" maxlength="500"></textarea>
        <div id="counter">500</div>
      </section>

      <section class="agreement-section">
        <label id="label-infos">Você concorda com o uso das informações acima?</label>
        <input type="checkbox" id="agreement">
      </section>

      <button type="submit" id="submit-btn" disabled>Enviar</button>

    </form>
    <img src="images/trybewarts-colored.svg" alt="Trybewarts Colored Logo" id="trybewarts-forms-logo">
  </main>

  <footer>Direitos reservados à Trybewarts©</footer>
</body>
<script src="script.js"></script>
</html>
